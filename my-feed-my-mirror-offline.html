<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Feed, My Mirror</title>
  <style>
/* style.css: all the looks. System fonts only, no downloads. */
:root {
  --bg: #fff7fb; --ink: #1f1b3a; --muted: #5b5778; --card: #ffffff; --line: #d9d3f2;
  --accent: #5b3fd1; --accent-ink: #ffffff;
  --appearance: #d6408a; --hobbies: #e07b12; --learning: #2f7fd0; --friends: #2a9a64; --fun: #7f56d9;
  --t: .35s;                       /* animation speed (slower in presenter mode) */
  font-size: 18px;
}
/* presenter mode: the class sits on <html>, so every rem size grows */
.presenter { font-size: 24px; --t: .9s; }
@media (prefers-reduced-motion: reduce) { :root, .presenter { --t: 0s; } }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  line-height: 1.4;
}
button { font: inherit; color: inherit; cursor: pointer; min-height: 44px; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---- top bar ---- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap;
  padding: .5rem 1rem; background: var(--card); border-bottom: 2px solid var(--line); }
.brand { font-weight: 800; font-size: 1.1rem; }
.tools { display: flex; gap: .75rem; align-items: center; }
.seg { display: inline-flex; border: 2px solid var(--accent); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 0 .9rem; font-weight: 700; color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ghost { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 1rem; font-weight: 700; }

/* ---- start screen ---- */
.start { max-width: 35rem; margin: 0 auto; padding: 2.5rem 1rem; text-align: center; }
.hero { font-size: 4rem; }
.start h1 { font-size: 2.2rem; margin: .25rem 0; }
.start .sub { font-size: 1.3rem; color: var(--accent); font-weight: 700; margin: 0 0 1.25rem; }
.start p { margin: .25rem 0; font-size: 1.1rem; }
.big { margin-top: 1.5rem; min-height: 56px; padding: 0 2.5rem; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font-size: 1.2rem; font-weight: 800; }

/* ---- feed screen ---- */
.stage { display: flex; gap: 1.5rem; justify-content: center; align-items: flex-start; flex-wrap: wrap; padding: 1rem; }
.phone { width: min(100%, 22.2rem); background: var(--card); border: 3px solid var(--ink); border-radius: 28px; padding: .75rem; }
.flip { perspective: 1200px; height: 18.9rem; }
.flip-inner { position: relative; width: 100%; height: 100%; transition: transform var(--t); transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; gap: .4rem; overflow: auto; }
.back { transform: rotateY(180deg); background: #fff8e6; border: 2px dashed #c98a00; border-radius: 16px; padding: .9rem; }
.back h3 { margin: 0; }
.back ul { margin: .25rem 0; padding-left: 1.2rem; }
.head { display: flex; align-items: center; gap: .6rem; font-weight: 800; }
.avatar { width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: 1.4rem; }
.visual { flex: 1; min-height: 110px; display: grid; place-items: center; font-size: 3.6rem; border-radius: 16px; }
.caption { font-size: 1.05rem; font-weight: 600; }
.likes { color: var(--muted); font-size: .9rem; }
.links { display: flex; gap: .5rem; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0 .25rem; color: var(--accent); text-decoration: underline; font-weight: 700; font-size: .95rem; }

.actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: .35rem; margin-top: .6rem; }
.act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
  min-height: 3.6rem; padding: .25rem; border: 2px solid var(--line); border-radius: 14px; background: var(--card); }
.act:hover { border-color: var(--accent); }
.act .em { font-size: 1.5rem; }
.act .lb { font-size: .72rem; font-weight: 700; text-align: center; line-height: 1.1; }

.side { width: min(100%, 18.9rem); }
.panel { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 1rem; margin-bottom: 1rem; }
.panel h2 { font-size: 1rem; margin: 0 0 .6rem; }
.mrow { display: grid; grid-template-columns: 1fr 3rem; gap: .1rem .5rem; margin-bottom: .55rem; font-size: .85rem; font-weight: 700; }
.mpct { text-align: right; }
.track { grid-column: 1 / -1; height: 14px; background: #ece8fb; border-radius: 999px; overflow: hidden; }
.fill { height: 100%; width: 0; border-radius: 999px; transition: width var(--t); }
.disclaimer { font-size: .85rem; color: var(--muted); margin: 0; }
.counter { font-size: .9rem; color: var(--muted); margin: 0 0 1rem; }

/* topic colours (the label is always written too, so colour is never the only clue) */
.tp-appearance { background: var(--appearance); } .tp-hobbies { background: var(--hobbies); }
.tp-learning { background: var(--learning); }     .tp-friends { background: var(--friends); }
.tp-fun { background: var(--fun); }
.visual.tp-appearance { background: #fde3f0; } .visual.tp-hobbies { background: #ffeed8; }
.visual.tp-learning { background: #dcecff; }   .visual.tp-friends { background: #d9f5e6; }
.visual.tp-fun { background: #ebe1ff; }

/* ---- "Why am I seeing this?" pop-up ---- */
.backdrop { position: fixed; inset: 0; background: rgba(31, 27, 58, .55); display: grid; place-items: center; padding: 1rem; z-index: 10; }
.dialog { background: var(--card); border-radius: 20px; padding: 1.25rem; width: min(100%, 25.5rem); max-height: 90vh; overflow: auto; }
.dialog h2 { margin: 0 0 .5rem; }
.dialog li { margin-bottom: .5rem; }
.dialog .note { color: var(--muted); font-size: .9rem; }

@media (max-width: 860px) { .flip { height: 17.8rem; } }

/* ---- Mirror Check, Rewrite Challenge result, End ---- */
.page { max-width: 35rem; margin: 0 auto; padding: 1.5rem 1rem 2.5rem; text-align: center; }
.page h1 { font-size: 1.8rem; margin: .25rem 0 1rem; }
.page .panel { text-align: left; }
.page .hero { font-size: 4rem; }
.btn { min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 800; margin: 0 0 1rem; }
.row { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
.row .btn { margin: 0; }
.goal p { margin: 0; font-size: .95rem; }
.mirror-frame { border: 8px double var(--muted); border-radius: 28px; background: #eef3ff; padding: 1.25rem 1rem; margin-bottom: 1rem; }
.mirror-frame p { margin: 0; }
.mirror-topic { font-size: 1.9rem; font-weight: 800; margin-top: .4rem !important; }
.question { font-size: 1.25rem; font-weight: 800; margin: 1rem 0 .25rem; }
.qs { list-style: none; padding: 0; margin: 0 0 .75rem; color: var(--muted); font-style: italic; }
.result-label { margin: 0; color: var(--muted); font-weight: 700; }
.result-code { margin: 0 0 1rem; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 3.6rem; font-weight: 800; letter-spacing: .05em; }
.teaser { background: #fff8e6; border: 2px dashed #c98a00; border-radius: 16px; padding: 1rem; font-weight: 700; margin: 1rem 0; }
.tint-appearance { background: #fde3f0; border-color: var(--appearance); } .tint-hobbies { background: #ffeed8; border-color: var(--hobbies); }
.tint-learning { background: #dcecff; border-color: var(--learning); }   .tint-friends { background: #d9f5e6; border-color: var(--friends); }
.tint-fun { background: #ebe1ff; border-color: var(--fun); }

h1:focus { outline: none; }

/* ---- Learn cards ---- */
.big.alt { background: var(--card); color: var(--accent); border: 3px solid var(--accent); }
.start .row { gap: 1rem; }
.start .row .big { margin-top: 1.5rem; }
.learn { max-width: 40rem; }
.step { margin: 0 0 .5rem; color: var(--muted); font-weight: 700; font-size: .9rem; }
.learn-card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 1.25rem 1.25rem 1rem; text-align: left;
  touch-action: pan-y; animation: slidein var(--t) ease-out; }
.learn-card h1 { margin: .1rem 0 .5rem; font-size: 1.6rem; text-align: left; }
.learn-card p { margin: .5rem 0; font-size: 1.08rem; }
.lemoji { font-size: 3rem; }
.ours { background: #eef3ff; border-radius: 12px; padding: .5rem .75rem; font-size: .95rem !important; font-weight: 600; }
.src { color: var(--muted); font-size: .8rem !important; margin-top: 1rem !important; border-top: 1px solid var(--line); padding-top: .5rem; }
.clist { margin: .25rem 0; padding-left: 1.2rem; font-size: 1.05rem; } .clist li { margin-bottom: .35rem; }
.bigq { font-size: 1.2rem; font-weight: 800; color: var(--ink); font-style: normal; text-align: left; padding-left: 1.2rem; list-style: disc; }
.habit { display: inline-block; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: .4rem 1.2rem; font-weight: 800; }
.dots { display: flex; gap: .5rem; justify-content: center; margin: 1rem 0 0; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); } .dot.on { background: var(--accent); }
@keyframes slidein { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

/* The loop lights up one step at a time, then starts again (slower in presenter mode). */
.loop { --loop: calc(var(--t) * 28); list-style: none; display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; margin: 1rem 0; align-items: stretch; }
.loop li { flex: 1 1 110px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: .6rem; text-align: center;
  font-weight: 700; font-size: .9rem; position: relative; animation: lit var(--loop) infinite; animation-delay: calc(var(--loop) / 5 * var(--i)); }
.loop li::after { content: "→"; position: absolute; right: -.6rem; top: 50%; transform: translateY(-50%); font-weight: 800; color: var(--accent); background: var(--bg); line-height: 1; z-index: 1; }
.loop li:last-child::after { content: "↻"; }
@keyframes lit { 0% { background: #ffe9a8; border-color: #c98a00; transform: scale(1.05); } 16% { background: #ffe9a8; border-color: #c98a00; transform: scale(1.05); } 20%, 100% { background: var(--card); border-color: var(--line); transform: none; } }
@media (prefers-reduced-motion: reduce) { .loop li, .learn-card { animation: none; } }
.learn .row { margin-bottom: 1.25rem; } .learn .disclaimer { margin-top: .4rem; }

/* Mirror Check: two columns on wide screens so the buttons fit on one screen */
.page.wide { max-width: 53rem; }
.mirror-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
.mirror-grid .panel { margin-bottom: 0; }
@media (max-width: 860px) { .mirror-grid { grid-template-columns: 1fr; } }

/* ================= Cute theme: pastel, stickers, washi tape (Taiwan junior-high style) ================= */
:root { --pink: #ffd9ec; --mint: #d8f5e8; --lav: #e6defc; --butter: #fff1b8; --sky: #d9ecff; --peach: #ffe1cf; }
body { background-color: var(--bg); background-image: radial-gradient(#f6d7e9 1.3px, transparent 1.6px); background-size: 24px 24px; }
h1, h2, h3, .brand, .big, .btn, .chip, .tile .tt {
  font-family: "Yuanti TC", "Hiragino Maru Gothic ProN", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
.topbar { background: linear-gradient(90deg, #ffffff, #fff0f8 60%, #f0ebff); border-bottom: 3px dashed #f3c6e0; }
.lhs { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.brand { color: var(--accent); }
.btn, .big, .ghost, .chip, .tile, .react { transition: transform .15s ease, box-shadow .15s ease; }
.btn:hover, .big:hover { transform: translateY(-2px); }
.btn:active, .big:active { transform: translateY(1px); }
.btn { box-shadow: 0 4px 0 rgba(31, 27, 58, .18); }

@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { .stick, .te { animation: none !important; } }

/* ---- Home ---- */
.home { max-width: 62rem; margin: 0 auto; padding: 1.5rem 1rem 2.5rem; text-align: center; }
.sparkles { letter-spacing: .6rem; font-size: 1.4rem; margin-bottom: .25rem; }
.home h1 { font-size: 2.2rem; margin: .2rem 0; }
.home .sub { color: var(--accent); font-weight: 800; font-size: 1.2rem; margin: 0 0 1rem; }
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.25rem; }
.hcard { position: relative; text-align: left; border-radius: 30px; padding: 1.6rem 1.4rem 1.4rem; cursor: pointer;
  border: 3px solid rgba(31, 27, 58, .85); box-shadow: 0 8px 0 rgba(31, 27, 58, .85); transition: transform .2s ease, box-shadow .2s ease; }
.hcard:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: 0 12px 0 rgba(31, 27, 58, .85); }
.hcard.c1 { background: linear-gradient(160deg, var(--pink), var(--lav)); }
.hcard.c2 { background: linear-gradient(160deg, var(--mint), var(--butter)); }
.hcard::before { content: ""; position: absolute; top: -13px; left: 50%; width: 110px; height: 26px; transform: translateX(-50%) rotate(-3deg);
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.85) 0 8px, rgba(255,214,235,.9) 8px 16px); border: 1px dashed rgba(31,27,58,.25); }
.hcard.c2::before { background: repeating-linear-gradient(45deg, rgba(255,255,255,.85) 0 8px, rgba(190,235,215,.95) 8px 16px); }
.hcard .tag { display: inline-block; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: .1rem .8rem; font-weight: 800; font-size: .8rem; }
.hcard .stick { font-size: 4rem; line-height: 1.2; animation: bob 3.4s ease-in-out infinite; }
.hcard h2 { font-size: 1.6rem; margin: .2rem 0 .4rem; border: 0; padding: 0; }
.hcard p { margin: 0 0 1rem; font-size: 1.08rem; }
.hcard .btn { margin: 0; }

/* ---- Intro page of My Feed, My Mirror ---- */
.about .lead { font-size: 1.2rem; font-weight: 700; margin: .25rem 0 1rem; }
.goalcard { background: linear-gradient(160deg, var(--butter), var(--peach)); border: 3px solid var(--ink); border-radius: 24px; padding: .9rem 1.2rem; margin: 1rem 0; box-shadow: 0 6px 0 rgba(31,27,58,.85); }
.goalcard h2 { border: 0; margin: 0 0 .25rem; padding: 0; font-size: 1.25rem; }
.goalcard p { margin: 0; font-size: 1.12rem; font-weight: 600; }
.left, .panel.left { text-align: left; }
.panel.left h2 { font-size: 1.1rem; }

/* ---- Purpose / How to use boxes ---- */
.guide { display: flex; gap: .7rem; flex-wrap: wrap; align-items: flex-start; margin: .6rem 0 1.2rem; text-align: left; }
.dtl { flex: 1 1 18rem; background: #fff; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 rgba(31,27,58,.85); }
.dtl summary { cursor: pointer; list-style: none; padding: .55rem 1rem; min-height: 44px; font-weight: 800; display: flex; align-items: center; gap: .4rem; }
.dtl summary::-webkit-details-marker { display: none; }
.dtl summary::after { content: "＋"; margin-left: auto; color: var(--accent); }
.dtl[open] { background: #fffbe6; }
.dtl[open] summary::after { content: "－"; }
.dtl-body { padding: 0 1rem .9rem; }
.dtl-body p { margin: .2rem 0; }
.how { margin: .2rem 0; padding-left: 1.3rem; } .how li { margin: .3rem 0; }

/* ---- Tree Hole hub ---- */
.hub .sub { color: var(--accent); font-weight: 800; font-size: 1.15rem; margin: 0 0 .5rem; }
.demo-badge { display: inline-block; background: #fff; border: 2px dashed #c98a00; border-radius: 16px; padding: .5rem .9rem; margin: .4rem 0; font-size: .95rem; font-weight: 600; text-align: left; }
.th-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem; }
.tile { display: flex; flex-direction: column; align-items: center; gap: .3rem; text-align: center; border: 3px solid var(--ink); border-radius: 24px;
  padding: 1.1rem .8rem; min-height: 11rem; cursor: pointer; box-shadow: 0 6px 0 rgba(31,27,58,.85); }
.tile:hover { transform: translateY(-4px) rotate(-.8deg); box-shadow: 0 10px 0 rgba(31,27,58,.85); }
.tile .te { font-size: 2.8rem; animation: bob 3.6s ease-in-out infinite; }
.tile .tt { font-weight: 800; font-size: 1.15rem; }
.tile .tb { font-size: .92rem; }
.tl-qr { background: var(--pink); } .tl-filter { background: var(--sky); } .tl-wall { background: var(--mint); }
.tl-buddy { background: var(--butter); } .tl-help { background: var(--peach); } .tl-safety { background: var(--lav); }
.th-page > h1 { margin: .6rem 0 .2rem; }

/* ---- QR poster ---- */
.poster { max-width: 17rem; margin: 1rem auto; background: linear-gradient(160deg, var(--pink), var(--butter)); border: 3px solid var(--ink); border-radius: 24px;
  padding: 1rem; box-shadow: 0 8px 0 rgba(31,27,58,.85); transform: rotate(-1.5deg); }
.poster .pk { font-weight: 700; } .poster .pt { font-size: 1.6rem; font-weight: 800; margin: .1rem 0 .5rem; }
.poster .qr { width: 9.5rem; height: 9.5rem; border: 4px solid var(--ink); border-radius: 12px; background: #fff; }
.poster .pf { font-size: .8rem; color: var(--muted); margin: .25rem 0; } .poster p { margin: .2rem 0 0; font-weight: 600; }
.loop.once li:last-child::after { content: ""; }

/* ---- Safety-check demo ---- */
.filt textarea { width: 100%; font: inherit; padding: .6rem .8rem; border: 3px solid var(--ink); border-radius: 16px; resize: vertical; background: #fffdf8; color: var(--ink); margin-top: .3rem; }
.samples { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .7rem 0; }
.chip { min-height: 44px; padding: 0 1rem; border: 2px solid var(--ink); border-radius: 999px; background: #fff; font-weight: 700; }
.chip:hover { background: var(--lav); } .chip.on { background: var(--accent); color: #fff; }
.result { margin-top: 1rem; border: 3px solid var(--ink); border-radius: 20px; padding: .8rem 1rem; }
.result h3 { margin: 0 0 .2rem; font-size: 1.3rem; } .result p { margin: .2rem 0; }
.r-pass { background: var(--mint); } .r-reword { background: var(--butter); } .r-block { background: var(--peach); } .r-care { background: var(--pink); } .r-empty { background: #fff; }
.care-help { font-weight: 800; background: #fff; border-radius: 12px; padding: .4rem .7rem; }

/* ---- The Wall ---- */
.post { background: #fff; border: 3px solid var(--ink); border-radius: 20px; padding: .8rem 1rem; margin: .9rem 0; text-align: left; box-shadow: 0 5px 0 rgba(31,27,58,.85); }
.ptag { display: inline-block; background: var(--lav); border-radius: 999px; padding: .05rem .7rem; font-weight: 800; font-size: .8rem; }
.ptext { font-size: 1.1rem; margin: .4rem 0; font-weight: 600; }
.reacts { display: flex; gap: .5rem; flex-wrap: wrap; }
.react { min-height: 44px; padding: 0 .9rem; border: 2px solid var(--line); border-radius: 999px; background: #fff; font-weight: 800; }
.react:hover { border-color: var(--accent); } .react.on { background: var(--pink); border-color: var(--appearance); }
.reply { background: var(--mint); border-radius: 14px; padding: .5rem .8rem; margin-top: .6rem; } .reply p { margin: .2rem 0 0; }
.reported { color: var(--friends); font-weight: 700; }

/* ---- AI Buddy ---- */
.bubble { display: flex; gap: .7rem; align-items: flex-start; text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: .7rem 1rem; margin: .7rem 0; }
.bubble p { margin: .2rem 0; font-size: 1.08rem; } .bubble.answer { background: #fffbe6; }
.mascot { font-size: 2.6rem; animation: bob 3.2s ease-in-out infinite; }
.talkbox { text-align: left; background: var(--pink); border: 3px solid var(--ink); border-radius: 20px; padding: .6rem 1rem 0; }
.talkbox h3 { margin: .1rem 0; } .talkbox p { margin: .2rem 0 .6rem; }

/* ---- Help Map and Safety ---- */
.hgrid, .sgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .8rem; text-align: left; }
.hc, .sc { background: #fff; border: 3px solid var(--ink); border-radius: 20px; padding: .7rem .9rem; display: flex; gap: .7rem; align-items: flex-start; box-shadow: 0 4px 0 rgba(31,27,58,.85); }
.hc .he, .sc .se { font-size: 2rem; } .hc p, .sc p { margin: .2rem 0 0; font-size: .95rem; }
.sc { flex-wrap: wrap; } .sc > b { flex: 1 1 60%; align-self: center; } .sc p { flex: 1 1 100%; }
.num { font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.emg { background: #ffe9e9; border: 3px solid #d94b4b; border-radius: 24px; padding: .2rem 1rem 1rem; margin: 1rem 0; }

@media (max-width: 860px) { .home-grid { grid-template-columns: 1fr; } .th-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .th-grid, .hgrid, .sgrid { grid-template-columns: 1fr; } }

/* ---- Two columns on wide screens so the presenter never has to scroll for the answer ---- */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; text-align: left; }
.two > * { min-width: 0; }
.two .result { margin-top: 0; }
.two .bubble.answer { margin-top: 0; }
.two .poster { margin: .3rem auto; }

  <script>
// ---- js/algorithm.js ----
// algorithm.js: the "teaching model" of My Feed, My Mirror.
// It is a SIMPLIFIED model made by students. It is NOT the real algorithm of any app.
// Pure functions only: no DOM, no network, no storage. Works in the browser and in Node.
(function (root) {
  'use strict';

  // ---- All the numbers live here. Change a number, and the whole feed changes. ----
  var CONFIG = {
    actions: {                 // how many points a topic gets when the player does this
      watch: 3,                // 👀 stayed a few seconds
      like: 2,                 // ❤️ liked
      share: 3,                // 🔁 shared
      skip: -1,                // ⏭️ scrolled past fast
      notInterested: -4        // 🚫 "Not interested"
    },
    popularBonus: 1,           // extra points for a "very popular" post
    randomMax: 0.5,            // tiny random number (0 to this) only to break ties
    exploreEvery: 5,           // every 5th post is an "Explore pick"
    maxTopicRun: 2,            // at most 2 posts in a row from the same topic (decision (b))
    mixWindow: 10,             // the mix meter looks at the last 10 posts
    challenge: {
      actionLimit: 12,         // the player gets 12 actions
      window: 10,              // then we look at the next 10 posts
      maxAppearancePct: 20,    // Appearance must be 20% or less
      minTopics: 3,            // at least 3 topics ...
      minTopicPct: 15          // ... must have 15% or more each
    },
    driftedStart: {            // the Rewrite Challenge starts from a drifted feed
      appearance: 12, hobbies: 2, learning: 0, friends: 1, fun: 0
    }
  };

  var TOPICS = ['appearance', 'hobbies', 'learning', 'friends', 'fun'];
  var TOPIC_LABEL = {
    appearance: 'Appearance', hobbies: 'Sports, Music & Art',
    learning: 'Science & Learning', friends: 'Friends & Kindness', fun: 'Pets & Funny'
  };
  var ACTION_VERB = {          // used in the plain-English "reasons"
    watch: 'watched {n} {topic} post(s) for a long time',
    like: 'liked {n} {topic} post(s)',
    share: 'shared {n} {topic} post(s)',
    skip: 'skipped {n} {topic} post(s)',
    notInterested: 'said "Not interested" to {n} {topic} post(s)'
  };

  // A small seeded random generator, so tests give the same result every time.
  function seededRandom(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function createState(posts, options) {
    options = options || {};
    var scores = {}, log = {};
    TOPICS.forEach(function (t) {
      scores[t] = (options.scores && options.scores[t]) || 0;
      log[t] = {};
    });
    return {
      posts: posts, rng: options.rng || Math.random,
      scores: scores,        // topic -> points
      log: log,              // topic -> action -> how many times (for the reasons)
      history: [],           // posts shown so far, in order
      shownIds: {},          // posts shown in the current round
      pickCount: 0, actionCount: 0
    };
  }

  function createChallengeState(posts, options) {
    options = options || {};
    return createState(posts, { rng: options.rng, scores: CONFIG.driftedStart });
  }

  function cloneState(state) {
    var copy = createState(state.posts, { rng: state.rng, scores: state.scores });
    TOPICS.forEach(function (t) { copy.log[t] = Object.assign({}, state.log[t]); });
    copy.history = state.history.slice();
    copy.shownIds = Object.assign({}, state.shownIds);
    copy.pickCount = state.pickCount;
    copy.actionCount = state.actionCount;
    return copy;
  }

  // The player did something to a post. Its topic gains or loses points.
  function applyAction(state, action, post) {
    if (!(action in CONFIG.actions)) throw new Error('Unknown action: ' + action);
    var delta = CONFIG.actions[action];
    state.scores[post.topic] += delta;
    state.log[post.topic][action] = (state.log[post.topic][action] || 0) + 1;
    state.actionCount += 1;
    return delta;
  }

  function seenCount(state, topic) {
    return state.history.filter(function (p) { return p.topic === topic; }).length;
  }

  // How many posts at the end of the history share the topic of the last post.
  function topicRun(state) {
    var h = state.history, n = 0;
    while (n < h.length && h[h.length - 1 - n].topic === h[h.length - 1].topic) n++;
    return n;
  }

  // Diversity rule: never the same creator twice in a row;
  // never more than CONFIG.maxTopicRun posts of one topic in a row.
  function isAllowed(state, post) {
    var last = state.history[state.history.length - 1];
    if (!last) return true;
    if (post.creator === last.creator) return false;
    if (post.topic === last.topic && topicRun(state) >= CONFIG.maxTopicRun) return false;
    return true;
  }

  function baseScore(state, post) {
    return state.scores[post.topic] + (post.veryPopular ? CONFIG.popularBonus : 0);
  }

  function bestOf(list) {
    return list.reduce(function (a, b) { return b.s > a.s ? b : a; });
  }

  // Build the plain-English reasons for the chosen post.
  function buildReasons(state, post, explored, blocked) {
    var reasons = [];
    if (explored) {
      reasons.push({ code: 'explore', topic: post.topic, points: 0,
        text: "Explore pick: you haven't seen much " + TOPIC_LABEL[post.topic] });
    } else {
      var log = state.log[post.topic];
      Object.keys(CONFIG.actions).forEach(function (a) {
        if (!log[a]) return;
        var pts = log[a] * CONFIG.actions[a];
        reasons.push({ code: a, topic: post.topic, n: log[a], points: pts,
          text: 'You ' + ACTION_VERB[a].replace('{n}', log[a]).replace('{topic}', TOPIC_LABEL[post.topic]) +
                ' (' + (pts > 0 ? '+' : '') + pts + ')' });
      });
      if (post.veryPopular) {
        reasons.push({ code: 'popular', topic: post.topic, points: CONFIG.popularBonus,
          text: 'This post is very popular (+' + CONFIG.popularBonus + ')' });
      }
      if (blocked) {
        reasons.push({ code: 'diversity', topic: blocked.post.topic, kind: blocked.kind,
          text: 'Not shown before: ' + (blocked.kind === 'creator'
            ? 'the last post was by the same creator'
            : 'the last posts were also ' + TOPIC_LABEL[blocked.post.topic]) + ' (diversity rule)' });
      }
    }
    if (reasons.length === 0) {
      reasons.push({ code: 'chance', topic: post.topic, points: 0,
        text: 'Nothing you did points here yet, so it was picked by popularity and a little chance' });
    }
    return reasons;
  }

  // Choose the next post. Returns { post, reasons, explore }.
  function pickNext(state) {
    var last = state.history[state.history.length - 1];
    var pool = state.posts.filter(function (p) { return !state.shownIds[p.id]; });
    var allowed = pool.filter(function (p) { return isAllowed(state, p); });

    if (allowed.length === 0) {   // round finished (or a dead end): start a new round
      state.shownIds = {};
      if (last) state.shownIds[last.id] = true;
      pool = state.posts.filter(function (p) { return !state.shownIds[p.id]; });
      allowed = pool.filter(function (p) { return isAllowed(state, p); });
      if (allowed.length === 0) allowed = pool;   // last resort, should not happen
    }

    var scored = allowed.map(function (p) {
      return { post: p, s: baseScore(state, p) + state.rng() * CONFIG.randomMax };
    });

    var chosen = null, explored = false;
    if ((state.pickCount + 1) % CONFIG.exploreEvery === 0) {
      // Explore slot: the topic the player has seen least (ties: lowest score).
      var order = TOPICS.slice().sort(function (a, b) {
        return seenCount(state, a) - seenCount(state, b) || state.scores[a] - state.scores[b];
      });
      for (var i = 0; i < order.length && !chosen; i++) {
        var cands = scored.filter(function (c) { return c.post.topic === order[i]; });
        if (cands.length) { chosen = bestOf(cands); explored = true; }
      }
    }
    if (!chosen) chosen = bestOf(scored);

    // Did the diversity rule hold back an even better post?
    var blocked = null;
    if (last && !explored) {
      var top = pool.reduce(function (a, b) { return baseScore(state, b) > baseScore(state, a) ? b : a; });
      if (baseScore(state, top) > baseScore(state, chosen.post) && !isAllowed(state, top)) {
        blocked = { post: top, kind: top.creator === last.creator ? 'creator' : 'topic' };
      }
    }

    var reasons = buildReasons(state, chosen.post, explored, blocked);
    state.history.push(chosen.post);
    state.shownIds[chosen.post.id] = true;
    state.pickCount += 1;
    return { post: chosen.post, reasons: reasons, explore: explored };
  }

  // Percent of each topic in a list of posts.
  function mixOf(posts) {
    var out = {};
    TOPICS.forEach(function (t) { out[t] = 0; });
    posts.forEach(function (p) { out[p.topic] += 100 / posts.length; });
    return out;
  }

  // Feed mix meter: the last 10 posts shown.
  function mix(state) {
    return mixOf(state.history.slice(-CONFIG.mixWindow));
  }

  // Mirror Check: the topic with the most points.
  function mirror(state) {
    return TOPICS.reduce(function (a, b) { return state.scores[b] > state.scores[a] ? b : a; });
  }

  // Forget which posts were shown (a fresh round), but never repeat the very last one.
  function freshRound(state) {
    var last = state.history[state.history.length - 1];
    state.shownIds = {};
    if (last) state.shownIds[last.id] = true;
  }

  // Rewrite Challenge start: a feed that has ALREADY drifted. We let it show 10 posts first,
  // so the mix meter starts "drifted", then start a fresh round so those posts can come back.
  function startChallenge(posts, options) {
    var s = createChallengeState(posts, options);
    for (var i = 0; i < CONFIG.mixWindow; i++) pickNext(s);
    freshRound(s);
    s.actionCount = 0;
    return s;
  }

  // Rewrite Challenge: look at the NEXT 10 posts (on a copy, so the real feed is untouched).
  // We judge a fresh round, so only the player's NEW scores matter, not which posts are used up.
  function evaluateChallenge(state) {
    var c = CONFIG.challenge, sim = cloneState(state), picks = [];
    freshRound(sim);
    for (var i = 0; i < c.window; i++) picks.push(pickNext(sim).post);
    var m = mixOf(picks);
    var topicsOk = TOPICS.filter(function (t) { return m[t] >= c.minTopicPct; }).length;
    var win = m.appearance <= c.maxAppearancePct && topicsOk >= c.minTopics &&
              state.actionCount <= c.actionLimit;
    var used = state.actionCount;
    return { win: win, actions: used, mix: m, topicsOk: topicsOk,
             code: (win ? 'WIN-' : 'TRY-') + used };
  }

  var api = {
    CONFIG: CONFIG, TOPICS: TOPICS, TOPIC_LABEL: TOPIC_LABEL,
    seededRandom: seededRandom, createState: createState, startChallenge: startChallenge,
    cloneState: cloneState, applyAction: applyAction, pickNext: pickNext,
    mix: mix, mixOf: mixOf, mirror: mirror, evaluateChallenge: evaluateChallenge
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.MFMM = api;
})(typeof window !== 'undefined' ? window : this);

  // A picture that LOOKS like a QR code, on purpose NOT a real one (it opens nothing).
  function fakeQr() {
    var n = 25, seed = 7, cells = '';
    function inFinder(x, y) { return (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7); }
    function finderOn(x, y) {   // the big square, white ring, small square in each corner
      var cx = x >= n - 7 ? x - (n - 7) : x, cy = y >= n - 7 ? y - (n - 7) : y;
      var d = Math.max(Math.abs(cx - 3), Math.abs(cy - 3));
      return d === 3 || d <= 1;
    }
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        seed = (seed * 75 + 74) % 65537;   // a tiny fixed pattern, always the same picture
        if (inFinder(x, y) ? finderOn(x, y) : ((seed >> 3) & 1) === 1) cells += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
      }
    }
    return '<svg class="qr" viewBox="-1 -1 27 27" role="img" aria-label="' + t('qr.fake') + '"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/>' +
           '<g fill="#1f1b3a">' + cells + '</g></svg>';
  }

    goto('challenge');

    S.result = M.evaluateChallenge(S.game);

    M.applyAction(S.game, action, S.current.post);   // 1. the topic gains or loses points
    if (S.screen === 'challenge' && S.game.actionCount >= M.CONFIG.challenge.actionLimit) return finishChallenge();
    S.current = M.pickNext(S.game);                   // 2. the model picks the next post

  document.addEventListener('click', function (e) {
    if (e.target.classList.contains('backdrop')) return closeWhy();
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var a = el.dataset.act;
    if (a === 'play') startGame();
    else if (a === 'restart' || a === 'home') { S.game = null; S.result = null; goto('home'); }
    else if (a === 'again') { S.game = null; S.result = null; goto('start'); }
    else if (a === 'open1') goto('about1');
    else if (a === 'go1') goto('start');
    else if (a === 'open2' || a === 'th-hub') { S.thView = 'hub'; goto('th'); }
    else if (a === 'th-open') { S.thView = el.dataset.view; goto('th'); }
    else if (a === 'f-sample') {
      S.f.text = TH.SAMPLES.filter(function (x) { return x.id === el.dataset.id; })[0].text[S.lang];
      S.f.checked = false;
      fillFilter();
    }
    else if (a === 'f-check') { S.f.checked = true; fillFilter(); }
    else if (a === 'buddy-q') {
      S.buddy = el.dataset.id;
      document.getElementById('buddyOut').innerHTML = buddyHtml();
      document.querySelectorAll('[data-act="buddy-q"]').forEach(function (b) {
        var on = b.dataset.id === S.buddy;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on);
      });
    }
    else if (a === 'react' || a === 'report') {
      var id = el.dataset.post;
      if (a === 'react') { S.mine[id] = S.mine[id] || {}; S.mine[id][el.dataset.kind] = !S.mine[id][el.dataset.kind]; }
      else S.reported[id] = true;
      document.getElementById('wallList').innerHTML = wallHtml();
      var again = document.querySelector(a === 'react' ? '[data-act="react"][data-post="' + id + '"][data-kind="' + el.dataset.kind + '"]' : '.reported');
      if (again && a === 'react') again.focus({ preventScroll: true });
    }
    else if (a === 'learn') { S.card = 0; goto('learn'); }
    else if (a === 'next') learnMove(1);
    else if (a === 'back') learnMove(-1);
    else if (a === 'toplay') startGame();
    else if (a === 'mirror') goto('mirror');
    else if (a === 'keep') goto('feed');
    else if (a === 'challenge') startChallenge();
    else if (a === 'check') finishChallenge();
    else if (a === 'finish') goto('end');
    else if (a === 'lang') { S.lang = el.dataset.lang; render(); }
    else if (a === 'action') doAction(el.dataset.action);
    else if (a === 'why') showWhy(el);
    else if (a === 'closewhy') closeWhy();
    else if (a === 'behind') { flip(true); document.querySelector('[data-act="flipback"]').focus(); }
    else if (a === 'flipback') { flip(false); document.querySelector('[data-act="behind"]').focus(); }
  });
  // Keep what is typed in the safety-check box (no redraw, so the cursor stays where it is).
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'fText') return;
    S.f.text = e.target.value;
    S.f.checked = false;
    document.getElementById('fCount').textContent = e.target.value.length + ' / 300';
    document.getElementById('fOut').innerHTML = filterPlaceholder();
  });
  // Remember which Purpose / How-to-use boxes are open (the toggle event does not bubble, so listen while capturing).
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (d && d.tagName === 'DETAILS' && d.dataset.key) S.open[d.dataset.key] = d.open;
  }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeWhy();
    if (S.screen === 'learn' && !document.querySelector('.backdrop')) {
      if (e.key === 'ArrowRight') learnMove(1);
      if (e.key === 'ArrowLeft') learnMove(-1);
    }
  });

  // Swipe a Learn card: drag left for next, right for back.
  var swipeX = null;
  document.addEventListener('pointerdown', function (e) { swipeX = e.target.closest('.learn-card') ? e.clientX : null; });
  document.addEventListener('pointerup', function (e) {
    if (swipeX === null || S.screen !== 'learn') return;
    var dx = e.clientX - swipeX;
    swipeX = null;
    if (dx < -50) learnMove(1); else if (dx > 50) learnMove(-1);
  });

  render();
})();

</script>
</body>
</html>
